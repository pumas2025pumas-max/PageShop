<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Costos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Gestor de Costos</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" id="exportBtn">Exportar JSON</button>
      <label class="btn btn-secondary" for="importInput" role="button">Importar JSON</label>
      <input type="file" id="importInput" accept="application/json" hidden />
      <button class="btn btn-danger" id="resetBtn">Reiniciar</button>
    </div>
  </header>

  <section class="insights-bar" id="insightsBar" aria-live="polite">
    <article class="insight-card" data-type="productos">
      <span class="insight-title">Productos</span>
      <strong class="insight-value" id="insightProductos">0</strong>
      <p class="insight-sub" id="insightProductosSub">Sin registros</p>
    </article>
    <article class="insight-card" data-type="ingredientes">
      <span class="insight-title">Ingredientes</span>
      <strong class="insight-value" id="insightIngredientes">0</strong>
      <p class="insight-sub" id="insightIngredientesSub">Sin registros</p>
    </article>
    <article class="insight-card" data-type="costos">
      <span class="insight-title">Costo promedio/u</span>
      <strong class="insight-value" id="insightCosto">$ 0,00</strong>
      <p class="insight-sub" id="insightCostoSub">Crea productos para ver métricas</p>
    </article>
  </section>

  <div class="mobile-tabs" id="mobileTabs">
    <button data-target="productos" class="active">Productos</button>
    <button data-target="detalle">Detalle</button>
    <button data-target="ingredientes">Ingredientes</button>
  </div>

  <main class="layout">
    <section class="card panel" id="productosPanel">
      <div class="section-title">
        <h2 class="sidebar-title">Productos</h2>
        <div class="table-actions">
          <button class="btn btn-secondary" id="duplicateProductBtn">Duplicar</button>
          <button class="btn btn-danger" id="deleteProductBtn">Eliminar</button>
        </div>
      </div>
      <div class="list-toolbar">
        <label class="sr-only" for="productSearch">Buscar producto</label>
        <input
          type="search"
          class="search-input"
          id="productSearch"
          placeholder="Buscar producto"
          aria-label="Buscar producto"
        />
        <select id="productSort" class="sort-select" aria-label="Ordenar productos">
          <option value="name-asc">Nombre (A-Z)</option>
          <option value="name-desc">Nombre (Z-A)</option>
          <option value="cost-asc">Costo/u (menor a mayor)</option>
          <option value="cost-desc">Costo/u (mayor a menor)</option>
        </select>
      </div>
      <div class="product-list" id="productList" role="listbox" aria-label="Lista de productos"></div>
      <button class="btn btn-primary" id="newProductBtn">Nuevo producto</button>
    </section>

    <section class="card panel" id="detallePanel">
      <div class="section-title">
        <h2>Detalle del producto</h2>
        <span class="tag" id="detalleTag">Sin seleccionar</span>
      </div>
      <div id="productDetail" aria-live="polite"></div>
    </section>

    <section class="card panel" id="ingredientesPanel">
      <div class="section-title">
        <h2 class="sidebar-title">Ingredientes</h2>
      </div>
      <div class="table-wrapper" aria-live="polite">
        <table>
          <thead>
            <tr>
              <th><button type="button" class="sort-header" data-field="nombre">Nombre</button></th>
              <th><button type="button" class="sort-header" data-field="unidad">Unidad</button></th>
              <th><button type="button" class="sort-header" data-field="costo_por_unidad">Costo/u</button></th>
            </tr>
          </thead>
          <tbody id="ingredientsTable"></tbody>
        </table>
      </div>
      <form id="ingredientForm" class="form-grid" autocomplete="off">
        <input type="hidden" id="ingredientId" />
        <div class="form-row">
          <label for="ingredientName">Nombre</label>
          <input type="text" id="ingredientName" required />
        </div>
        <div class="form-row">
          <label for="ingredientUnit">Unidad</label>
          <input type="text" id="ingredientUnit" />
        </div>
        <div class="form-row">
          <label for="ingredientCost">Costo por unidad</label>
          <input type="text" id="ingredientCost" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Guardar ingrediente</button>
          <button type="button" class="btn btn-secondary" id="ingredientClearBtn">Limpiar</button>
          <button type="button" class="btn btn-danger" id="ingredientDeleteBtn" disabled>Eliminar</button>
        </div>
        <p class="message" id="ingredientMessage" role="alert"></p>
      </form>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
